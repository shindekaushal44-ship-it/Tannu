<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thank You!</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&family=Playfair+Display:ital,wght@0,600;1,700&display=swap" rel="stylesheet">
    
    <style>
        /* Overall Page Styling */
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 100%);
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            box-sizing: border-box;
        }

        /* Glass Card Styling */
        .page {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: clamp(25px, 5vw, 40px) clamp(20px, 4vw, 30px);
            width: 85%;
            max-width: 380px;
            
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 15px 35px rgba(238, 156, 167, 0.3);
            text-align: center;
            
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Romantic Typography */
        h1 {
            font-family: 'Playfair Display', serif;
            color: #d63050; 
            font-size: clamp(28px, 8vw, 36px); 
            margin-top: 0;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
            line-height: 1.2;
            font-style: italic;
        }

        /* Styling for the question below the Thank You */
        h2 {
            font-family: 'Montserrat', sans-serif;
            color: #444444;
            font-size: clamp(16px, 5vw, 19px);
            font-weight: 500;
            margin-top: 0;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        /* Responsive Image Styling */
        img {
            width: 100%;
            max-width: clamp(180px, 50vw, 240px);
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            border: 4px solid rgba(255, 255, 255, 0.9);
            object-fit: cover;
        }

        /* Button Container */
        .button-container {
            display: flex;
            width: 100%;
            justify-content: center;
        }

        /* Premium For You Button */
        .btn-foryou {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: clamp(16px, 4.5vw, 18px);
            padding: 14px 35px;
            width: 100%;
            max-width: 240px;
            background: #d63050; /* Solid romantic pink */
            color: #ffffff; 
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(214, 48, 80, 0.3);
            
            /* Mobile touch safety */
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-foryou:hover {
            transform: translateY(-2px);
            background: #be2643;
            box-shadow: 0 8px 20px rgba(214, 48, 80, 0.4);
        }

        .btn-foryou:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="page">
        <h1>Thank you Madam ❤️</h1>
        
        <h2>Are you ready for your surprise?</h2>
        
        <img src="ttk.jpeg" alt="Happy impress image">
        
        <div class="button-container">
            <button class="btn-foryou" onclick="window.location.href='ttt/tk.html'">For you </button>
        </div>
    </div>

</body>
</html>
